name: Verify PivotStudio
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Measure 100k-row pivot cost (informational)
        run: node scripts/benchmark-pivot.mjs
      - run: npm run build
      - id: browser-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install CJK fonts for visual screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real browser smoke (desktop, tablet, mobile)
        env:
          CHROME_BIN: ${{ steps.browser-chrome.outputs.chrome-path }}
        run: node scripts/browser-smoke.mjs
      - name: R1-R8 Chromium acceptance
        env:
          CHROME_BIN: ${{ steps.browser-chrome.outputs.chrome-path }}
        run: npm run test:browser -- --project=chromium
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivotstudio-browser-evidence
          path: artifacts/browser/*
          if-no-files-found: ignore

  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install WebKit and native libraries
        run: npx playwright install --with-deps webkit
      - name: R1-R8 WebKit acceptance
        run: npm run test:browser -- --project=webkit
      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pivotstudio-webkit-evidence
          path: test-results/
          if-no-files-found: ignore
