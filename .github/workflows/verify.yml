name: Verify PivotStudio
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser for UI regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser quality checks
        run: node scripts/browser-regression.cjs
      - name: Preserve viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivotstudio-viewport-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
