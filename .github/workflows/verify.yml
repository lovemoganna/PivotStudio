name: Verify PivotStudio
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - id: browser-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Real browser smoke (desktop, tablet, mobile)
        env:
          CHROME_BIN: ${{ steps.browser-chrome.outputs.chrome-path }}
        run: node scripts/browser-smoke.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivotstudio-browser-evidence
          path: artifacts/browser/*.png
          if-no-files-found: ignore
